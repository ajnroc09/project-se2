<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Add Song</title>
</head>
<body>
<h2>Add a New Song</h2>

<form th:action="@{/song/add}" th:object="${song}" method="post">

    <label for="title">Title:</label>
    <input type="text" id="title" th:field="*{title}" />

    <!-- File path -->
    <label for="filePath">File Path:</label>
    <input type="text" id="filePath" th:field="*{filePath}" />

    <!-- Cover Image -->
    <label for="coverImage">Cover Image:</label>
    <input type="text" id="coverImage" th:field="*{coverImage}" />

    <!-- Release Date -->
    <label for="releaseDate">Release Date:</label>
    <input type="date" id="releaseDate" th:field="*{releaseDate}" />

    <!-- Duration -->
    <label for="duration">Duration (seconds):</label>
    <input type="number" id="duration" th:field="*{duration}" />

    <!-- Album -->
    <label for="album">Album:</label>
    <select id="album" th:field="*{album}">
        <option th:each="a : ${albumList}" th:value="${a.albumID}" th:text="${a.albumName}"></option>
    </select>

    <!-- Artists -->
    <label for="artistsOfSong">Artists:</label>
    <select id="artistsOfSong" multiple th:field="*{artistsOfSong}">
        <option th:each="artist : ${artists}" th:value="${artist.artistID}" th:text="${artist.artistName}"></option>
    </select>

    <!-- Genres -->
    <label for="genresOfSong">Genres:</label>
    <select id="genresOfSong" multiple th:field="*{genresOfSong}">
        <option th:each="g : ${genres}" th:value="${g.genreID}" th:text="${g.genreName}"></option>
    </select>



    <button type="submit">Save Song</button>
</form>

</body>
</html>
