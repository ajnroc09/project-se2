<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Artist List</title>
</head>
<body>
<h1>All Artists</h1>

<a href="/album/list">Go to album list</a>
<a href="/song/list">Go to song list</a>
<a href="/genre/list">Go to genre list</a>

<!-- Link to Add New Artist -->
<p><a href="/artist/add">Add New Artist</a></p>

<!-- Artist Table -->
<table border="1">
    <thead>
    <tr>
        <th>Artist Name</th>
        <th>Bio</th>
        <th>Actions</th>
    </tr>
    </thead>
    <tbody>
    <!-- Iterate over the list of artists -->
    <tr th:each="artist : ${artists}">
        <td th:text="${artist.artistName}"></td> <!-- Display artist name -->
        <td th:text="${artist.bio}"></td> <!-- Display artist bio -->
        <td>
            <!-- Link to Edit Artist -->
            <a th:href="@{/artist/update/{id}(id=${artist.artistID})}">Edit</a> |
            <!-- Link to Delete Artist -->
            <a th:href="@{/artist/delete/{id}(id=${artist.artistID})}" onclick="return confirm('Are you sure you want to delete this artist?');">Delete</a>
        </td>
    </tr>
    </tbody>
</table>

<!-- Link to return to the home page or any other page -->
<p><a href="/">Back to Home</a></p>

</body>
</html>
