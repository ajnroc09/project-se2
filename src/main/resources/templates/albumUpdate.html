<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Update Album</title>
</head>
<body>
<h2>Update Album</h2>

<form th:action="@{/album/update}" method="post" th:object="${album}">
    <input type="hidden" th:field="*{albumID}"/>

    <label>Album Name:</label><br/>
    <input type="text" th:field="*{albumName}" placeholder="Album Title"/><br/><br/>

    <label>Release Date:</label><br/>
    <input type="date" th:field="*{releaseDate}"/><br/><br/>

    <label>Songs:</label><br/>
    <select multiple th:field="*{songIds}" size="5">
        <option th:each="song : ${songs}"
                th:value="${song.songID}"
                th:text="${song.title}"></option>
    </select>
    <br/><br/>

    <label>Artists:</label><br/>
    <select multiple th:field="*{artistIds}" size="5">
        <option th:each="artist : ${artists}"
                th:value="${artist.artistID}"
                th:text="${artist.artistName}"></option>
    </select><br/><br/>

    <button type="submit">Save Album</button>
</form>

<!-- Optional warnings -->
<p th:if="${#lists.isEmpty(songs)}">⚠️ No songs available yet. You can add songs later.</p>
<p th:if="${#lists.isEmpty(artists)}">⚠️ No artists available yet. You can add artists later.</p>

</body>
</html>
