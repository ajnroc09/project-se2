<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head><title>Add Genre</title></head>
<body>
<h1>Add Genre</h1>
<form th:action="@{/genre/add}" th:object="${genre}" method="post">
    <label>Name:</label>
    <input type="text" th:field="*{genreName}" required/>
    <br>
    <button type="submit">Save</button>
</form>
<a href="/genre/list">Back to list</a>
</body>
</html>
