<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Update Song</title>
</head>
<body>
<h1>Update Song</h1>

<form th:action="@{/song/save}" th:object="${song}" method="post">

    <!-- Song ID (Hidden) -->
    <input type="hidden" th:field="*{songID}"/>

    <!-- Title -->
    <label>Title:</label>
    <input type="text" th:field="*{title}" required/>
    <br>

    <!-- File Path -->
    <label>File Path:</label>
    <input type="text" th:field="*{filePath}" required/>
    <br>

    <!-- Cover Image -->
    <label>Cover Image URL:</label>
    <input type="text" th:field="*{coverImage}"/>
    <br>
    <img th:if="*{coverImage}" th:src="*{coverImage}" alt="Cover Image" width="100"/>
    <br>

    <!-- Release Date -->
    <label>Release Date:</label>
    <input type="date"
           th:value="${#dates.format(song.releaseDate, 'yyyy-MM-dd')}"
           name="releaseDate"/>
    <br>

    <!-- Duration -->
    <label>Duration (seconds):</label>
    <input type="number" th:field="*{duration}" required/>
    <br>

    <!-- Artists (Multi-select) -->
    <label>Artists:</label>
    <select name="artistsOfSong" multiple required>
        <option th:each="artist : ${artists}"
                th:value="${artist.artistID}"
                th:text="${artist.artistName}"
                th:selected="${song.artistsOfSong.contains(artist)}">
        </option>
    </select>
    <br>

    <!-- Genres (Multi-select) -->
    <label>Genres:</label>
    <select name="genresOfSong" multiple required>
        <option th:each="genre : ${genres}"
                th:value="${genre.genreID}"
                th:text="${genre.genreName}"
                th:selected="${song.genresOfSong.contains(genre)}">
        </option>
    </select>
    <br>

    <!-- Album (Single-select) -->
    <label>Album:</label>
    <select name="album" required>
        <option th:each="albumItem : ${albumList}"
                th:value="${albumItem.albumID}"
                th:text="${albumItem.albumName}"
                th:selected="${song.album.albumID == albumItem.albumID}">
        </option>
    </select>
    <br>

    <!-- Save Button -->
    <button type="submit">Save</button>
</form>

<a href="/song/list">Back to List</a>
</body>
</html>
