<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head><title>Update Genre</title></head>
<body>
<h1>Update Genre</h1>
<form th:action="@{/genre/update}" th:object="${genre}" method="post">
    <input type="hidden" th:field="*{genreID}" />
    <label>Name:</label>
    <input type="text" th:field="*{genreName}" required/>
    <br>
    <button type="submit">Update</button>
</form>
<a href="/genre/list">Back to list</a>
</body>
</html>
